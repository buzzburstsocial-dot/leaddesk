<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #09090c;
      --surface: #111115;
      --border:  rgba(255,255,255,0.07);
      --text:    #e8e8ed;
      --muted:   #5a5a70;
      --accent:  #8b5cf6;
      --accent2: #6366f1;
      --user-bg: linear-gradient(135deg, #8b5cf6, #6366f1);
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }

    /* Header */
    .chat-header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 13px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .chat-avatar {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
    }
    .chat-info { flex: 1; min-width: 0; }
    .chat-biz { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; }
    .chat-close {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 6px; width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 14px; cursor: pointer; flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    .chat-close:hover { background: rgba(255,255,255,0.09); color: var(--text); }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
      background: linear-gradient(135deg, #1a1a22, #222230);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 12px;
    }
    .msg-bubble {
      max-width: 76%; padding: 9px 13px; border-radius: 12px;
      font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    }
    .msg.bot .msg-bubble {
      background: var(--surface); border: 1px solid var(--border);
      border-bottom-left-radius: 3px; color: var(--text);
    }
    .msg.user .msg-bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 3px; color: #fff;
      box-shadow: 0 2px 12px rgba(139,92,246,0.3);
    }

    /* Typing */
    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 2px 2px; height: 16px; }
    .typing-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--muted); animation: tdot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .18s; }
    .typing-dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes tdot {
      0%,80%,100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    /* Lead notice */
    .lead-notice {
      margin: 0 16px 4px; padding: 10px 14px;
      background: rgba(74,222,128,0.07); border: 1px solid rgba(74,222,128,0.15);
      border-radius: 9px; font-size: 12px; color: #4ade80; display: none;
    }
    .lead-notice.show { display: block; }

    /* Input */
    .chat-input-row {
      border-top: 1px solid var(--border); padding: 10px 12px;
      display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0; background: var(--surface);
    }
    .chat-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 13px; font-size: 13px;
      font-family: inherit; color: var(--text); outline: none;
      resize: none; max-height: 110px; line-height: 1.45;
      transition: border-color .15s;
    }
    .chat-input:focus { border-color: rgba(139,92,246,0.4); }
    .chat-input::placeholder { color: var(--muted); }
    .send-btn {
      width: 36px; height: 36px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 9px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .15s, box-shadow .15s;
      box-shadow: 0 0 12px rgba(139,92,246,0.3);
    }
    .send-btn:hover { opacity: .88; }
    .send-btn:disabled { opacity: .35; cursor: default; }
    .send-btn svg { fill: #fff; width: 14px; height: 14px; }

    .powered {
      text-align: center; padding: 6px 0 8px;
      font-size: 10px; color: rgba(255,255,255,0.15);
      letter-spacing: 0.04em; background: var(--surface);
    }
  </style>
</head>
<body>

<div class="chat-header">
  <div class="chat-avatar">💬</div>
  <div class="chat-info">
    <div class="chat-biz" id="biz-name">Loading…</div>
    <div class="chat-status"><span class="status-dot"></span>Online · replies instantly</div>
  </div>
  <button class="chat-close" onclick="parent.postMessage('ld-close','*')" title="Close">✕</button>
</div>

<div class="messages" id="messages"></div>

<div class="lead-notice" id="lead-notice">
  ✓ Your details have been passed on — we'll be in touch soon!
</div>

<div class="chat-input-row">
  <textarea class="chat-input" id="chat-input" rows="1" placeholder="Ask a question…"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>
<div class="powered">Powered by LeadDesk</div>

<script>
  const params  = new URLSearchParams(location.search);
  const agentId = params.get('agentId') || 'dev';
  let history     = [];
  let streaming   = false;
  let leadCapture = false;

  async function init() {
    if (agentId !== 'dev') {
      try {
        const r = await fetch(`/api/agent/${agentId}`);
        if (r.ok) {
          const d = await r.json();
          document.getElementById('biz-name').textContent = d.businessName || 'Chat Support';
        }
      } catch {}
    } else {
      document.getElementById('biz-name').textContent = 'Preview Mode';
    }
    appendBot("Hi there 👋 I'm here to help. What can I do for you today?");
  }

  function appendBot(text, typing = false) {
    const msgs = document.getElementById('messages');
    const div  = document.createElement('div');
    div.className = 'msg bot' + (typing ? ' typing' : '');
    div.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble">${typing ? '<div class="typing-dots"><span></span><span></span><span></span></div>' : escHtml(text)}</div>
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function appendUser(text) {
    const msgs = document.getElementById('messages');
    const div  = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
    if (streaming) return;
    const input = document.getElementById('chat-input');
    const text  = input.value.trim();
    if (!text) return;
    input.value = ''; input.style.height = '';
    appendUser(text);

    const userMsg = { role: 'user', content: text };
    streaming = true;
    document.getElementById('send-btn').disabled = true;

    const typingEl = appendBot('', true);
    const msgs     = document.getElementById('messages');

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agentId, message: text, history }),
      });

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let botBubble = null;
      let buffer    = '';
      let fullText  = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const json = line.slice(5).trim();
          if (!json) continue;
          const ev = JSON.parse(json);

          if (ev.text) {
            if (!botBubble) {
              typingEl.remove();
              const d = document.createElement('div');
              d.className = 'msg bot';
              d.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-bubble"></div>';
              msgs.appendChild(d);
              botBubble = d.querySelector('.msg-bubble');
            }
            fullText += ev.text;
            botBubble.innerHTML = escHtml(fullText.replace(/<<<LEAD:[^>]+>>>/g, '').trimEnd());
            msgs.scrollTop = msgs.scrollHeight;
          }
          if (ev.done) {
            if (ev.lead && !leadCapture) {
              leadCapture = true;
              document.getElementById('lead-notice').classList.add('show');
            }
            history.push(userMsg, { role: 'assistant', content: fullText });
          }
          if (ev.error) {
            if (!botBubble) typingEl.remove();
            appendBot('Something went wrong — please try again.');
          }
        }
      }
    } catch {
      typingEl.remove();
      appendBot('Connection error — please try again.');
    }

    streaming = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('chat-input').focus();
  }

  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  document.getElementById('chat-input').addEventListener('input', function () {
    this.style.height = '';
    this.style.height = Math.min(this.scrollHeight, 110) + 'px';
  });

  init();
</script>
</body>
</html>
