<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7c3aed;
      --purple-dark: #6d28d9;
      --purple-light: #ede9fe;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; background: #fff; color: var(--text);
    }

    /* Header */
    .chat-header {
      background: var(--purple); color: #fff;
      padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .chat-avatar {
      width: 36px; height: 36px; background: rgba(255,255,255,.2);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .chat-header-info { flex: 1; }
    .chat-biz-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
    .chat-status { font-size: 12px; opacity: .8; }
    .chat-close {
      background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;
      padding: 4px; opacity: .8; line-height: 1;
    }
    .chat-close:hover { opacity: 1; }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .msg { display: flex; gap: 8px; align-items: flex-end; }
    .msg.user { flex-direction: row-reverse; }
    .msg-bubble {
      max-width: 75%; padding: 10px 14px; border-radius: 16px;
      font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .msg.bot .msg-bubble { background: #f3f4f6; border-bottom-left-radius: 4px; }
    .msg.user .msg-bubble { background: var(--purple); color: #fff; border-bottom-right-radius: 4px; }
    .msg-avatar {
      width: 28px; height: 28px; background: var(--purple-light); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0;
    }
    .typing .msg-bubble { min-width: 56px; }
    .typing-dots { display: flex; gap: 4px; align-items: center; justify-content: center; height: 18px; }
    .typing-dots span {
      width: 6px; height: 6px; background: var(--muted); border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* Lead capture success */
    .lead-notice {
      margin: 0 16px; padding: 12px 14px; background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 10px; font-size: 13px; color: #15803d; display: none;
    }
    .lead-notice.show { display: block; }

    /* Input */
    .chat-input-row {
      padding: 12px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0;
    }
    .chat-input {
      flex: 1; border: 1px solid var(--border); border-radius: 22px;
      padding: 10px 16px; font-size: 14px; font-family: inherit; outline: none;
      resize: none; max-height: 120px; line-height: 1.4;
      transition: border-color .15s;
    }
    .chat-input:focus { border-color: var(--purple); }
    .send-btn {
      width: 40px; height: 40px; background: var(--purple); border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background .15s; flex-shrink: 0; align-self: flex-end;
    }
    .send-btn:hover { background: var(--purple-dark); }
    .send-btn:disabled { opacity: .4; cursor: default; }
    .send-btn svg { fill: #fff; width: 16px; height: 16px; }
    .powered-by { text-align: center; font-size: 11px; color: #d1d5db; padding-bottom: 8px; }
  </style>
</head>
<body>

<div class="chat-header">
  <div class="chat-avatar">💬</div>
  <div class="chat-header-info">
    <div class="chat-biz-name" id="biz-name">Loading...</div>
    <div class="chat-status">Online · Typically replies instantly</div>
  </div>
  <button class="chat-close" onclick="parent.postMessage('ld-close','*')" title="Close">×</button>
</div>

<div class="messages" id="messages"></div>

<div class="lead-notice" id="lead-notice">
  ✅ Your details have been passed on — we'll be in touch soon!
</div>

<div class="chat-input-row">
  <textarea class="chat-input" id="chat-input" rows="1" placeholder="Type a message…"></textarea>
  <button class="send-btn" id="send-btn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>
<div class="powered-by">Powered by LeadDesk</div>

<script>
  const params = new URLSearchParams(location.search);
  const agentId = params.get('agentId') || 'dev';
  let history = [];
  let streaming = false;
  let leadCaptured = false;

  async function init() {
    if (agentId !== 'dev') {
      try {
        const r = await fetch(`/api/agent/${agentId}`);
        if (r.ok) {
          const d = await r.json();
          document.getElementById('biz-name').textContent = d.businessName || 'Chat Support';
        }
      } catch {}
    } else {
      document.getElementById('biz-name').textContent = 'Dev Preview';
    }
    appendBot("Hi there! 👋 I'm here to help answer your questions. What can I do for you today?");
  }

  function appendBot(text, typing = false) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg bot' + (typing ? ' typing' : '');
    div.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble">${typing ? '<div class="typing-dots"><span></span><span></span><span></span></div>' : escHtml(text)}</div>
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function appendUser(text) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
    if (streaming) return;
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = '';
    appendUser(text);

    const userMsg = { role: 'user', content: text };
    streaming = true;
    document.getElementById('send-btn').disabled = true;

    const typingEl = appendBot('', true);
    const msgs = document.getElementById('messages');

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agentId, message: text, history }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let botBubble = null;
      let buffer = '';
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const json = line.slice(5).trim();
          if (!json) continue;
          const ev = JSON.parse(json);

          if (ev.text) {
            if (!botBubble) {
              typingEl.remove();
              const msgDiv = document.createElement('div');
              msgDiv.className = 'msg bot';
              msgDiv.innerHTML = '<div class="msg-avatar">🤖</div><div class="msg-bubble"></div>';
              msgs.appendChild(msgDiv);
              botBubble = msgDiv.querySelector('.msg-bubble');
            }
            fullText += ev.text;
            // Strip lead marker from display
            const display = fullText.replace(/<<<LEAD:[^>]+>>>/g, '').trimEnd();
            botBubble.innerHTML = escHtml(display);
            msgs.scrollTop = msgs.scrollHeight;
          }

          if (ev.done) {
            if (ev.lead && !leadCaptured) {
              leadCaptured = true;
              document.getElementById('lead-notice').classList.add('show');
            }
            history.push(userMsg, { role: 'assistant', content: fullText });
          }
          if (ev.error) {
            if (!botBubble) typingEl.remove();
            appendBot('Sorry, something went wrong. Please try again.');
          }
        }
      }
    } catch {
      typingEl.remove();
      appendBot('Connection error — please try again.');
    }

    streaming = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('chat-input').focus();
  }

  // Send on Enter (Shift+Enter for newline)
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Auto-resize textarea
  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = '';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  init();
</script>

</body>
</html>
